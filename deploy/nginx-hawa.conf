# Replace HAWA_DOMAIN before installing. Next.js runs on 3100; PHP stays private on 8001.
server {
    listen 127.0.0.1:8001;
    server_name localhost;
    root /var/www/hawa/current/backend/public;
    index index.php;
    client_max_body_size 6m;

    location / { try_files $uri $uri/ /index.php?$query_string; }
    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass unix:/run/php/php8.5-fpm-hawa.sock;
        fastcgi_read_timeout 180s;
    }
    location ~ \.php$ { return 404; }
    location ~ /\. { deny all; }
}

server {
    listen 80;
    listen [::]:80;
    server_name HAWA_DOMAIN;
    client_max_body_size 6m;

    # All APIs and Sanctum sessions share the storefront origin.
    location ^~ /_next/static/ {
        alias /var/www/hawa/shared/next-static/;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 180s;
    }
    location /sanctum/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    # Keep the frontend's image proxy and monitoring endpoints in Next.js.
    location = /api/image-proxy { include /etc/nginx/snippets/hawa-next-proxy.conf; }
    location = /api/monitoring { include /etc/nginx/snippets/hawa-next-proxy.conf; }
    location = /api/csp-report { include /etc/nginx/snippets/hawa-next-proxy.conf; }

    # Next serves bundled files and forwards new uploads to Laravel storage.
    location / { include /etc/nginx/snippets/hawa-next-proxy.conf; }
}
