name: Laravel and storefront verification
on:
  push:
    branches: [main, master]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-only-password
          MYSQL_DATABASE: hawa_backend_test
        ports: [3306:3306]
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pci-only-password"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: hawa_backend_test
      DB_USERNAME: root
      DB_PASSWORD: ci-only-password
      CACHE_STORE: array
      SESSION_DRIVER: database
      BCRYPT_ROUNDS: 4
      LARAVEL_API_URL: http://127.0.0.1:8001
      MEDIA_STORAGE_DIR: /tmp/hawa-media
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, gd, exif, mbstring
          tools: composer:v2
      - run: npm ci
      - run: composer install --working-dir=backend --no-interaction
      - name: Initialize isolated Laravel test environment
        working-directory: backend
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan migrate --seed --force
      - run: npm run test:backend
      - run: npm run test:run
      - name: Restore empty test storefront after concurrency fixtures
        run: php backend/artisan migrate:fresh --seed --force
      - name: Start backend for production build
        run: php backend/artisan serve --host=127.0.0.1 --port=8001 --no-reload > /tmp/hawa-backend.log 2>&1 &
      - run: npm run typecheck
      - run: npm run build
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Browser smoke tests
        run: npx playwright test e2e/laravel-empty-storefront.spec.ts --project=desktop-chromium
        env:
          PREWARM_IMAGES_ON_START: 'false'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: verification-failures
          path: |
            test-results/
            playwright-report/
            backend/storage/logs/
